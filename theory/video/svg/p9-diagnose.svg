ffffff" fill-opacity="0.93">contention profiles</text><rect x="818" y="50" width="353" height="310" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="994.5" y="165.74" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.0" fill="#e3eefa">[new exceptions]</text><text x="994.5" y="195.14000000000001" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Error Reporting</text><text x="994.5" y="234.18" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.8" fill="#ffffff" fill-opacity="0.93">Groups stack traces, counts,</text><text x="994.5" y="261.62" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.8" fill="#ffffff" fill-opacity="0.93">notifies</text><rect x="1207" y="50" width="353" height="310" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1383.5" y="165.74" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.0" fill="#fde3de">[which SQL]</text><text x="1383.5" y="195.14000000000001" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Query Insights</text><text x="1383.5" y="234.18" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.8" fill="#ffffff" fill-opacity="0.93">Plus index advisor, on Cloud</text><text x="1383.5" y="261.62" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.8" fill="#ffffff" fill-opacity="0.93">SQL and AlloyDB</text><rect x="40" y="400" width="1520" height="54.4" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="438.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">A service can be slow while idle, waiting on a dependency. CPU utilisation tells you neither.</text></svg>