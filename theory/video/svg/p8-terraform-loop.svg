ff" fill-opacity="0.93">Attach it to the review.</text><text x="600.5" y="268.53499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Shows drift.</text><rect x="834" y="50" width="327" height="320" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="997.5" y="155.235" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#fde3de">[from a pipeline]</text><text x="997.5" y="185.685" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">terraform apply</text><text x="997.5" y="225.905" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">As a deploy account, by</text><text x="997.5" y="254.325" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">impersonation or</text><text x="997.5" y="282.745" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">federation</text><rect x="1231" y="50" width="327" height="320" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1394.5" y="169.445" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[backend with locking]</text><text x="1394.5" y="199.89499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">State in GCS</text><text x="1394.5" y="240.11499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Versioned, restricted,</text><text x="1394.5" y="268.53499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">never in git