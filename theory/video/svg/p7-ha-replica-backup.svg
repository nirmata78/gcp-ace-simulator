<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 510" width="1600" height="510"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="510" fill="#ffffff"/><rect x="40" y="50" width="482" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="281.0" y="172.97" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#e3eefa">[survive a zone]</text><text x="281.0" y="208.67000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">HA standby</text><text x="281.0" y="254.79000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Synchronous, automatic failover.</text><text x="281.0" y="288.11" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Serves no reads.</text><rect x="558" y="50" width="482" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="799.0" y="172.97" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#e3eefa">[scale reads, DR]</text><text x="799.0" y="208.67000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Read replica</text><text x="799.0" y="254.79000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Asynchronous. Replicates a bad</text><text x="799.0" y="288.11" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">DELETE within seconds.</text><rect x="1076" y="50" width="482" height="340" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1317.0" y="156.31" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#fde3de">[undo a bad statement]</text><text x="1317.0" y="192.01" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">PITR</text><text x="1317.0" y="238.13" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Clones to a new instance at a</text><text x="1317.0" y="271.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">timestamp. Needs logs enabled</text><text x="1317.0" y="304.77" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">beforehand.</text><rect x="40" y="430" width="1520" height="54.4" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="468.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">High availability is not read capacity, and a replica is not a backup.</text></svg>