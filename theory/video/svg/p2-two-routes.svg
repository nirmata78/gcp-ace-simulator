anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25.7" fill="#ffffff" fill-opacity="0.93">Created automatically for a new Free Trial customer.</text><text x="1189.0" y="275.025" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25.7" fill="#ffffff" fill-opacity="0.93">Named after the user, never a domain. Google</text><text x="1189.0" y="307.36499999999995" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25.7" fill="#ffffff" fill-opacity="0.93">accounts and workforce pool principals.</text></svg>