<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 500" width="1600" height="500"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="500" fill="#ffffff"/><path d="M460.0,160.0 L1140.0,160.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)" marker-start="url(#c4a-s)"/><text x="800.0" y="29.8" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">BGP session over tunnel 0</text><text x="800.0" y="50.2" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.6" fill="#6e7781" font-style="italic" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[169.254.0.1 ↔ 169.254.0.2]</text><path d="M460.0,160.0 L560.0,230.0 L1040.0,230.0 L1140.0,160.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)" marker-start="url(#c4a-s)"/><text x="800.0" y="259.8" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">BGP session over tunnel 1</text><text x="800.0" y="280.2" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.6" fill="#6e7781" font-style="italic" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[169.254.1.1 ↔ 169.254.1.2]</text><path d="M1350.0,260.0 L1350.0,360.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><rect x="40" y="60" width="420" height="200" rx="9" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.6"/><text x="250.0" y="122.035" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.4" fill="#ececec">[AS 65001 (public or private)]</text><text x="250.0" y="150.385" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">On-premises router</text><text x="250.0" y="188.245" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">advertises 10.0.0.0/8,</text><text x="250.0" y="214.705" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">172.16.0.0/12</text><rect x="1140" y="60" width="420" height="200" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1350.0" y="122.035" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.4" fill="#fde3de">[AS 65010 (private, required)]</text><text x="1350.0" y="150.385" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Cloud Router</text><text x="1350.0" y="188.245" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">advertises the VPC&#x27;s subnets, +</text><text x="1350.0" y="214.705" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">custom ranges</text><rect x="1140" y="360" width="420" height="110" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1350.0" y="407.44" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.3" fill="#e3eefa">[what was learned]</text><text x="1350.0" y="432.64" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Dynamic routes in the VPC</text><rect x="40" y="360" width="1050" height="111.60000000000001" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="394.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#3b2a07">Lower MED (advertised route priority) = preferred path. A failed tunnel&#x27;s routes</text><text x="52" y="425.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#3b2a07">are withdrawn, so traffic moves by itself. That is why HA VPN&#x27;s 99.99% SLA needs</text><text x="52" y="456.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#3b2a07">BGP.</text></svg>