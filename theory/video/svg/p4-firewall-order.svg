<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 500" width="1600" height="500"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="500" fill="#ffffff"/><path d="M288.0,200.0 L358.0,200.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><path d="M606.0,200.0 L676.0,200.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><path d="M924.0,200.0 L994.0,200.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><path d="M1242.0,200.0 L1312.0,200.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><rect x="40" y="50" width="248" height="300" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="164.0" y="151.76" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.3" fill="#e3eefa">[policy]</text><text x="164.0" y="176.95999999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">1 Org</text><text x="164.0" y="205.27999999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">hierarchical</text><text x="164.0" y="239.59999999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">Applies to every VPC</text><text x="164.0" y="263.11999999999995" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">beneath</text><rect x="358" y="50" width="248" height="300" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="482.0" y="151.76" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.3" fill="#e3eefa">[top down]</text><text x="482.0" y="176.95999999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">2 Folder</text><text x="482.0" y="205.27999999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">hierarchical</text><text x="482.0" y="239.59999999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">Then each folder in</text><text x="482.0" y="263.11999999999995" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">turn</text><rect x="676" y="50" width="248" height="300" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="800.0" y="163.52" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.3" fill="#e3eefa">[order configurable]</text><text x="800.0" y="188.72000000000003" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">3 VPC rules +</text><text x="800.0" y="217.04000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">global policy</text><text x="800.0" y="251.36" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">On the one network</text><rect x="994" y="50" width="248" height="300" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1118.0" y="191.48" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">4 Regional policy</text><text x="1118.0" y="225.79999999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">One VPC, one region</text><rect x="1312" y="50" width="248" height="300" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1436.0" y="165.92000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.3" fill="#fde3de">[lowest priority]</text><text x="1436.0" y="191.12" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">5 Implied rules</text><text x="1436.0" y="225.44" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">Allow egress, deny</text><text x="1436.0" y="248.96" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">ingress</text><rect x="40" y="390" width="1520" height="90.8" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="428.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">Evaluated top to bottom, and it stops at the first allow or deny. goto_next hands evaluation down to</text><text x="52" y="464.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">the next level.</text></svg>