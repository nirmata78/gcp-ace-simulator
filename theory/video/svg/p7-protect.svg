<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 510" width="1600" height="510"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="510" fill="#ffffff"/><rect x="40" y="50" width="353" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="216.5" y="179.445" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[accidents]</text><text x="216.5" y="209.89499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Versioning</text><text x="216.5" y="250.11499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Keeps noncurrent versions</text><text x="216.5" y="278.53499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">on overwrite or delete.</text><rect x="429" y="50" width="353" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="605.5" y="179.445" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[accidents]</text><text x="605.5" y="209.89499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Soft delete</text><text x="605.5" y="250.11499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Deleted objects restorable:</text><text x="605.5" y="278.53499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">7 days default, up to 90.</text><rect x="818" y="50" width="353" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="994.5" y="179.445" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[time-based]</text><text x="994.5" y="209.89499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Retention policy</text><text x="994.5" y="250.11499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">No delete or overwrite</text><text x="994.5" y="278.53499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">until the age is reached.</text><rect x="1207" y="50" width="353" height="340" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1383.5" y="151.025" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#fde3de">[intent]</text><text x="1383.5" y="181.47500000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Bucket Lock</text><text x="1383.5" y="221.69500000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Locks retention</text><text x="1383.5" y="250.115" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">permanently: nobody,</text><text x="1383.5" y="278.535" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">including Owner, can</text><text x="1383.5" y="306.95500000000004" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">shorten it.</text><rect x="40" y="430" width="1520" height="90.8" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="468.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">Versioning and soft delete protect against accidents. A locked retention policy protects against</text><text x="52" y="504.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">intent.</text></svg>