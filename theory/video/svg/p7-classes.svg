<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 500" width="1600" height="500"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="500" fill="#ffffff"/><rect x="40" y="50" width="353" height="320" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="216.5" y="168.15" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.4" fill="#e3eefa">[0 days]</text><text x="216.5" y="199.65" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Standard</text><text x="216.5" y="241.05" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">Hot. Highest storage</text><text x="216.5" y="270.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">price, no retrieval fee.</text><rect x="429" y="50" width="353" height="320" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="605.5" y="182.85" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.4" fill="#e3eefa">[30 days]</text><text x="605.5" y="214.35" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Nearline</text><text x="605.5" y="255.75" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">About once a month.</text><rect x="818" y="50" width="353" height="320" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="994.5" y="182.85" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.4" fill="#e3eefa">[90 days]</text><text x="994.5" y="214.35" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Coldline</text><text x="994.5" y="255.75" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">About once a quarter.</text><rect x="1207" y="50" width="353" height="320" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1383.5" y="153.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.4" fill="#fde3de">[365 days]</text><text x="1383.5" y="184.95" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Archive</text><text x="1383.5" y="226.35" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">Once a year or less.</text><text x="1383.5" y="255.75" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">Lowest storage price,</text><text x="1383.5" y="285.15" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">highest retrieval.</text><rect x="40" y="410" width="1520" height="54.4" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="448.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">All four have the same millisecond latency to the first byte. No thaw, no restore step, no waiting.</text></svg>