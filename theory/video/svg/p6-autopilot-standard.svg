<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 510" width="1600" height="510"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="510" fill="#ffffff"/><rect x="40" y="50" width="742" height="330" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="411.0" y="167.97" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#fde3de">[Google owns the nodes]</text><text x="411.0" y="203.67000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Autopilot</text><text x="411.0" y="249.79000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">You pay for Pod requests. Always regional.</text><text x="411.0" y="283.11" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Best-practice defaults on and enforced.</text><rect x="818" y="50" width="742" height="330" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1189.0" y="167.97" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#e3eefa">[you own the node pools]</text><text x="1189.0" y="203.67000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Standard</text><text x="1189.0" y="249.79000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">You pay for nodes, full or not. Zonal or regional.</text><text x="1189.0" y="283.11" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Node access and privileged Pods allowed.</text><rect x="40" y="420" width="1520" height="90.8" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="458.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">&quot;Do not want to manage nodes&quot; is Autopilot, not Standard with node auto-provisioning and</text><text x="52" y="494.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">autoscaling.</text></svg>