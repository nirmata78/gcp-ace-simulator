<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 700" width="1600" height="700"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="700" fill="#ffffff"/><path d="M660.0,85.0 L900.0,85.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><text x="780.0" y="45.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">too long</text><path d="M350.0,150.0 L220.0,300.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><text x="250.0" y="184.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">acceptable: where is the</text><text x="250.0" y="215.6" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">data?</text><rect x="40" y="20" width="620" height="130" rx="9" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><text x="350.0" y="75.56" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Volume ÷ usable bandwidth = days</text><text x="350.0" y="114.6" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.8" fill="#ffffff" fill-opacity="0.93">1 Gbps ≈ 10 TB a day · 100 Mbps ≈ 1 TB a day</text><rect x="900" y="20" width="660" height="130" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1230.0" y="59.46000000000001" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.0" fill="#fde3de">[not acceptable]</text><text x="1230.0" y="88.86" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Transfer Appliance</text><text x="1230.0" y="127.9" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.8" fill="#ffffff" fill-opacity="0.93">ship a device, load on site, send it back</text><rect x="40" y="300" width="360" height="200" rx="9" fill="#1168bd" stroke="#0b4884" stroke-width="1.6"/><text x="220.0" y="361.63" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Storage Transfer</text><text x="220.0" y="393.49" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Service</text><text x="220.0" y="431.35" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">Other cloud, URLs, another</text><text x="220.0" y="457.81" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">bucket</text><rect x="430" y="300" width="360" height="200" rx="9" fill="#1168bd" stroke="#0b4884" stroke-width="1.6"/><text x="610.0" y="390.79" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">STS with agent pools</text><text x="610.0" y="428.65000000000003" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">On-premises file systems</text><rect x="820" y="300" width="360" height="200" rx="9" fill="#1168bd" stroke="#0b4884" stroke-width="1.6"/><text x="1000.0" y="374.85999999999996" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">gcloud storage cp,</text><text x="1000.0" y="406.71999999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">rsync</text><text x="1000.0" y="444.58" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">Small, one-off, scripted</text><rect x="1210" y="300" width="360" height="200" rx="9" fill="#1168bd" stroke="#0b4884" stroke-width="1.6"/><text x="1390.0" y="374.85999999999996" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">BigQuery Data Transfer</text><text x="1390.0" y="406.71999999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Service</text><text x="1390.0" y="444.58" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">Into BigQuery, recurring</text><rect x="40" y="550" width="1520" height="90.8" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="588.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">500 TB over 100 Mbps is about 500 days, so the sum eliminates every network tool before you read the</text><text x="52" y="624.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">options.</text></svg>