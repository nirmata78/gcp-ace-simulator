<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 530" width="1600" height="530"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="530" fill="#ffffff"/><rect x="40" y="50" width="482" height="340" rx="9" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><circle cx="281.0" cy="36" r="15" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><text x="281.0" y="189.63" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#cfe0f3">[no external IP]</text><text x="281.0" y="225.32999999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Private VM</text><text x="281.0" y="271.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">needs to reach something outside</text><rect x="558" y="50" width="482" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="799.0" y="172.97" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#e3eefa">[per-subnet setting]</text><text x="799.0" y="208.67000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Private Google Access</text><text x="799.0" y="254.79000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Reaches Google APIs only: Cloud</text><text x="799.0" y="288.11" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Storage, BigQuery.</text><rect x="1076" y="50" width="482" height="340" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1317.0" y="156.31" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#fde3de">[regional, on Cloud Router]</text><text x="1317.0" y="192.01" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Cloud NAT</text><text x="1317.0" y="238.13" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Reaches the internet, outbound</text><text x="1317.0" y="271.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">only: package mirrors, a partner</text><text x="1317.0" y="304.77" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">API.</text><rect x="40" y="430" width="1520" height="54.4" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="468.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">A private VM that needs only Cloud Storage and BigQuery needs PGA and nothing else.</text></svg>