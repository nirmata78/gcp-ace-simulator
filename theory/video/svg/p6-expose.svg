93">IP. No LB</text><rect x="662" y="50" width="275" height="330" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="799.5" y="179.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[one IP, one Service]</text><text x="799.5" y="205.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">LoadBalancer</text><text x="799.5" y="241.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">Layer 4: a passthrough</text><text x="799.5" y="265.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">Network LB</text><rect x="973" y="50" width="275" height="330" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1110.5" y="179.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#fde3de">[one IP, many Services]</text><text x="1110.5" y="205.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Ingress</text><text x="1110.5" y="241.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">Host and path rules: an</text><text x="1110.5" y="265.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">Application LB</text><rect x="1284" y="50" width="275" height="330" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1421.5" y="167.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#fde3de">[Ingress&#x27;s successor]</text><text x="1421.5" y="193.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff"