<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 530" width="1600" height="530"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="530" fill="#ffffff"/><rect x="40" y="50" width="482" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="281.0" y="156.31" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#e3eefa">[plain string]</text><text x="281.0" y="192.01" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Network tag</text><text x="281.0" y="238.13" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Anyone able to edit the VM can</text><text x="281.0" y="271.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">add it. Adding web silently</text><text x="281.0" y="304.77" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">opens the VM to the web rule.</text><rect x="558" y="50" width="482" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="799.0" y="156.31" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#e3eefa">[guarded by IAM]</text><text x="799.0" y="192.01" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Target service account</text><text x="799.0" y="238.13" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Only someone who may attach that</text><text x="799.0" y="271.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">account, while the VM is</text><text x="799.0" y="304.77" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">stopped.</text><rect x="1076" y="50" width="482" height="340" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1317.0" y="172.97" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#fde3de">[guarded by IAM]</text><text x="1317.0" y="208.67000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Secure tag</text><text x="1317.0" y="254.79000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Attaching a value needs tagUser.</text><text x="1317.0" y="288.11" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Works in firewall policies.</text><rect x="40" y="430" width="1520" height="54.4" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="468.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">Network tags work only in VPC firewall rules. Firewall policies use secure tags, not network tags.</text></svg>