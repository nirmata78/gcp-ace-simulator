<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 400" width="1600" height="400"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="400" fill="#ffffff"/><rect x="40" y="50" width="482" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="281.0" y="156.31" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#e3eefa">[when you run it]</text><text x="281.0" y="192.01" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Terraform</text><text x="281.0" y="238.13" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Declarative. Reconciles at</text><text x="281.0" y="271.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">apply. Drift appears on the next</text><text x="281.0" y="304.77" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">plan.</text><rect x="558" y="50" width="482" height="340" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="799.0" y="156.31" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#fde3de">[continuously]</text><text x="799.0" y="192.01" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Config Connector</text><text x="799.0" y="238.13" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Kubernetes custom resources, in</text><text x="799.0" y="271.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">a cluster. A console change is</text><text x="799.0" y="304.77" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">reverted.</text><rect x="1076" y="50" width="482" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1317.0" y="156.31" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#e3eefa">[applications]</text><text x="1317.0" y="192.01" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Helm</text><text x="1317.0" y="238.13" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Charts, values, releases with</text><text x="1317.0" y="271.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">rollback. Does not create the</text><text x="1317.0" y="304.77" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">cluster.</text></svg>