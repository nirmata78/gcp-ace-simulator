<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 530" width="1600" height="530"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="530" fill="#ffffff"/><rect x="40" y="50" width="482" height="330" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="281.0" y="151.31" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#e3eefa">[identity]</text><text x="281.0" y="187.01" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Does it exist?</text><text x="281.0" y="233.13" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Cloud Identity, Workspace, an</text><text x="281.0" y="266.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">external IdP via federation, or</text><text x="281.0" y="299.77" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">a service account</text><rect x="558" y="50" width="482" height="330" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="799.0" y="167.97" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#e3eefa">[IAM]</text><text x="799.0" y="203.67000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">What may it do, where?</text><text x="799.0" y="249.79000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Allow policies, deny policies,</text><text x="799.0" y="283.11" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">conditions</text><rect x="1076" y="50" width="482" height="330" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1317.0" y="167.97" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#fde3de">[organization policy]</text><text x="1317.0" y="203.67000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">What is permitted at all?</text><text x="1317.0" y="249.79000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Configurations removed for</text><text x="1317.0" y="283.11" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">everyone, owners included</text><rect x="40" y="420" width="1520" height="54.4" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="458.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">Three questions, three systems. Keep them apart and most distractors fall away.</text></svg>