<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 620" width="1600" height="620"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="620" fill="#ffffff"/><rect x="40" y="40" width="400" height="150" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="240.0" y="91.07" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.7" fill="#e3eefa">[gcloud auth login]</text><text x="240.0" y="118.36999999999999" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">gcloud CLI</text><text x="240.0" y="155.04999999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.3" fill="#ffffff" fill-opacity="0.93">credentials for the command line</text><rect x="600" y="40" width="400" height="150" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="800.0" y="91.07" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.7" fill="#fde3de">[application-default login]</text><text x="800.0" y="118.36999999999999" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Your code</text><text x="800.0" y="155.04999999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.3" fill="#ffffff" fill-opacity="0.93">client libraries read ADC</text><rect x="1160" y="40" width="400" height="150" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1360.0" y="91.07" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.7" fill="#e3eefa">[gcloud auth configure-docker]</text><text x="1360.0" y="118.36999999999999" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Docker daemon</text><text x="1360.0" y="155.04999999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.3" fill="#ffffff" fill-opacity="0.93">credential helper for pushes</text><rect x="40" y="240" width="1520" height="50.5" rx="6" fill="#fdf3e1" stroke="#a86a12" stroke-width="1.4"/><text x="52" y="275.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#3b2a07">Three clients, three credential stores. Logging in one does not log in the others.</text><rect x="40" y="340" width="1520" height="83.0" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="375.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#3b2a07">The classic symptom: gcloud works on the laptop, but the program says it could not find default credentials. The</text><text x="52" y="407.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#3b2a07">fix is the middle box.</text></svg>