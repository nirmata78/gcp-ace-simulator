-family="Inter, Helvetica, Arial, sans-serif" font-size="20.3" fill="#ffffff" fill-opacity="0.93">global routing · subnets per team</text><rect x="860" y="190" width="700" height="140" rx="9" fill="#1168bd" stroke="#0b4884" stroke-width="1.6"/><text x="1210.0" y="236.07" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.7" fill="#d6e6f7">[HA VPN]</text><text x="1210.0" y="263.37" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">net-host-nonprod: vpc-nonprod</text><text x="1210.0" y="300.05" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.3" fill="#ffffff" fill-opacity="0.93">global routing · its own firewall rules</text><rect x="40" y="410" width="330" height="110" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="205.0" y="457.44" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.3" fill="#e3eefa">[GKE on host ranges]</text><text x="205.0" y="482.64" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">shop-prod</text><rect x="410" y="410" width="330" height="110" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="575.0" y="457.44" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.3" fill="#e3eefa">[networkUser on 1 subnet]</text><text x="575.0" y="482.64" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">data-prod</text><rect x="860" y="410" width="330" height="110" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1025.0" y="471.24" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">shop-dev</text><rect x="1230" y="410" width="330" height="110" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1395.0" y="471.24" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">shop-stg</text><rect x="40" y="570" width="1520" height="50.5" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="605.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#3b2a07">Hierarchical firewall policy at the org: rules no team can override. Org policy: no external IPs on VMs.</text><rect x="40" y="670" width="1520" height="83.0" rx="6" fill="#fdf3e1" stroke="#a86a12" stroke-width="1.4"/><text x="52" y="705.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#3b2a07">GKE in a service project: its GKE service agent needs Host Service Agent User on the host and Network User on</text><text x="52" y="737.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#3b2a07">the subnet.</text></svg>