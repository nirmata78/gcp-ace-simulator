<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 510" width="1600" height="510"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="510" fill="#ffffff"/><rect x="40" y="50" width="353" height="320" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="216.5" y="174.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[the hypervisor]</text><text x="216.5" y="200.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">compute.googleapis.com</text><text x="216.5" y="236.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">CPU, disk and network I/O. No</text><text x="216.5" y="260.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">agent needed.</text><rect x="429" y="50" width="353" height="320" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="605.5" y="174.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#fde3de">[the Ops Agent]</text><text x="605.5" y="200.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">agent.googleapis.com</text><text x="605.5" y="236.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">Memory, swap, disk space used,</text><text x="605.5" y="260.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">processes.</text><rect x="818" y="50" width="353" height="320" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="994.5" y="174.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[apps via the agent]</text><text x="994.5" y="200.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">workload.googleapis.com</text><text x="994.5" y="236.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">OpenTelemetry and third-party</text><text x="994.5" y="260.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">receivers.</text><rect x="1207" y="50" width="353" height="320" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1383.5" y="159.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[yours]</text><text x="1383.5" y="186.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">custom, logging,</text><text x="1383.5" y="215.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">prometheus</text><text x="1383.5" y="251.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">Custom metrics, log-based</text><text x="1383.5" y="275.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">metrics, Managed Prometheus.</text><rect x="40" y="410" width="1520" height="54.4" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="448.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">The hypervisor cannot see inside the guest. Memory appears only after the Ops Agent is installed.</text></svg>