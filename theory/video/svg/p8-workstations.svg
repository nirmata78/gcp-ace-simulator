ter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">configuration</text><text x="800.0" y="269.85" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">Machine type, image, persistent</text><text x="800.0" y="303.17" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">disk, timeouts, who may use it</text><rect x="1100" y="50" width="460" height="330" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1330.0" y="167.97" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.1" fill="#e3eefa">[one developer]</text><text x="1330.0" y="203.67000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Workstation</text><text x="1330.0" y="249.79000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">An instance of that</text><text x="1330.0" y="283.11" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26.5" fill="#ffffff" fill-opacity="0.93">configuration</text><rect x="40" y="420" width="1520" height="54.4" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="458.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">Only /home persists. Anything else is recreated from the image on every start.</text></svg>