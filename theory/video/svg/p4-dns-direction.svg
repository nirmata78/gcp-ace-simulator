<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 500" width="1600" height="500"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="500" fill="#ffffff"/><rect x="40" y="50" width="482" height="350" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="281.0" y="168.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.4" fill="#e3eefa">[Cloud → on-premises]</text><text x="281.0" y="199.95" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Forwarding zone</text><text x="281.0" y="241.35" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">Cloud VMs must resolve corp.local:</text><text x="281.0" y="270.75" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">send queries to on-premises</text><text x="281.0" y="300.15" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">resolvers.</text><rect x="558" y="50" width="482" height="350" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="799.0" y="168.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.4" fill="#fde3de">[on-premises → Cloud]</text><text x="799.0" y="199.95" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Inbound server policy</text><text x="799.0" y="241.35" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">On-premises hosts must resolve Cloud</text><text x="799.0" y="270.75" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">private zones: give them an address</text><text x="799.0" y="300.15" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">to query.</text><rect x="1076" y="50" width="482" height="350" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1317.0" y="183.15" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.4" fill="#e3eefa">[VPC → VPC]</text><text x="1317.0" y="214.65" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Peering zone</text><text x="1317.0" y="256.05" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">Resolve a domain using another VPC&#x27;s</text><text x="1317.0" y="285.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">DNS configuration.</text><rect x="40" y="440" width="1520" height="54.4" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="478.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">Direction decides the DNS object.</text></svg>