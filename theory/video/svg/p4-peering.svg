"/><text x="800.0" y="183.84" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">VPC B</text><rect x="1200" y="90" width="340" height="170" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1370.0" y="183.84" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">VPC C</text><rect x="60" y="400" width="1480" height="88.2" rx="6" fill="#fdf3e1" stroke="#a86a12" stroke-width="1.4"/><text x="72" y="437.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" fill="#3b2a07">Both sides must create it. No overlapping ranges. Subnet routes are exchanged; custom routes only</text><text x="72" y="472.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" fill="#3b2a07">with export and import; firewall rules are never exchanged.</text></svg>