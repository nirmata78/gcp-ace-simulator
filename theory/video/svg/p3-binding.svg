<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 560" width="1600" height="560"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="560" fill="#ffffff"/><path d="M480.0,150.0 L590.0,150.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="490.0" y="55.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">bound to</text><path d="M1010.0,150.0 L1120.0,150.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="1050.0" y="55.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">on</text><rect x="60" y="70" width="420" height="160" rx="9" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><circle cx="270.0" cy="56" r="15" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><text x="270.0" y="108.15" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.4" fill="#cfe0f3">[who]</text><text x="270.0" y="139.65" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Principal</text><text x="270.0" y="181.05" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">user, group, serviceAccount,</text><text x="270.0" y="210.45000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">principalSet</text><rect x="590" y="70" width="420" height="160" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="800.0" y="122.85" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.4" fill="#fde3de">[what]</text><text x="800.0" y="154.35" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Role</text><text x="800.0" y="195.75" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">a bundle of permissions</text><rect x="1120" y="70" width="420" height="160" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1330.0" y="108.15" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.4" fill="#e3eefa">[where]</text><text x="1330.0" y="139.65" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Resource</text><text x="1330.0" y="181.05" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">org, folder, project, or one</text><text x="1330.0" y="210.45000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">resource</text><rect x="60" y="300" width="1480" height="90.8" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="72" y="338.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">A policy is a list of bindings, plus an etag for safe concurrent edits, and version 3 when</text><text x="72" y="374.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">conditions are present. Each resource has at most one allow policy.</text></svg>