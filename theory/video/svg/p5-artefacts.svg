<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 400" width="1600" height="400"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="400" fill="#ffffff"/><rect x="40" y="50" width="353" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="216.5" y="179.445" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[one disk&#x27;s data]</text><text x="216.5" y="209.89499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Snapshot</text><text x="216.5" y="250.11499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Back up or clone that disk,</text><text x="216.5" y="278.53499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">anywhere</text><rect x="429" y="50" width="353" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="605.5" y="165.235" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[one bootable disk]</text><text x="605.5" y="195.685" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Custom image</text><text x="605.5" y="235.905" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Boot new VMs from a golden</text><text x="605.5" y="264.325" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">state; a template</text><text x="605.5" y="292.745" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">references it</text><rect x="818" y="50" width="353" height="340" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="994.5" y="151.025" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#fde3de">[the whole VM]</text><text x="994.5" y="181.47500000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Machine image</text><text x="994.5" y="221.69500000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">All disks plus</text><text x="994.5" y="250.115" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">configuration: type,</text><text x="994.5" y="278.535" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">metadata, tags, service</text><text x="994.5" y="306.95500000000004" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">account</text><rect x="1207" y="50" width="353" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1383.5" y="193.655" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[a recipe, no data]</text><text x="1383.5" y="224.10500000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Instance template</text><text x="1383.5" y="264.32500000000005" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0