<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 600" width="1600" height="600"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="600" fill="#ffffff"/><path d="M420.0,200.0 L560.0,200.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><path d="M1040.0,200.0 L1180.0,200.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><rect x="40" y="120" width="380" height="160" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="230.0" y="176.07" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.7" fill="#e3eefa">[MIG, no external IPs]</text><text x="230.0" y="203.36999999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Payment workers</text><text x="230.0" y="240.04999999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.3" fill="#ffffff" fill-opacity="0.93">recreated often</text><rect x="560" y="100" width="480" height="200" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="800.0" y="163.32999999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.7" fill="#fde3de">[manual IP assignment]</text><text x="800.0" y="190.62999999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Cloud Router + Cloud NAT</text><text x="800.0" y="227.30999999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.3" fill="#ffffff" fill-opacity="0.93">nat-ip-1, nat-ip-2: reserved regional</text><text x="800.0" y="252.78999999999996" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.3" fill="#ffffff" fill-opacity="0.93">static</text><rect x="1180" y="120" width="380" height="160" rx="9" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.6"/><text x="1370.0" y="191.81" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.7" fill="#ececec">[allow-list: exactly two IPs]</text><text x="1370.0" y="219.10999999999999" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Partner API</text><rect x="40" y="360" width="1520" height="83.0" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="395.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#3b2a07">Static IP per VM fails when the MIG recreates a VM. Automatic NAT IPs can change or grow. Private Google Access</text><text x="52" y="427.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#3b2a07">reaches Google APIs only.</text><rect x="40" y="470" width="1520" height="83.0" rx="6" fill="#fdf3e1" stroke="#a86a12" stroke-width="1.4"/><text x="52" y="505.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#3b2a07">Watch ports: many connections to one endpoint exhaust NAT ports first. Raise min ports per VM or use dynamic</text><text x="52" y="537.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#3b2a07">port allocation.</text></svg>