<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 540" width="1600" height="540"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="540" fill="#ffffff"/><rect x="40" y="50" width="482" height="360" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="281.0" y="173.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.4" fill="#e3eefa">[2 Gbps, encrypted, next week]</text><text x="281.0" y="204.95" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">HA VPN</text><text x="281.0" y="246.35" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">IPsec over the internet. 99.99% with</text><text x="281.0" y="275.75" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">two interfaces, two tunnels. Needs</text><text x="281.0" y="305.15" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">Cloud Router.</text><rect x="558" y="50" width="482" height="360" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="799.0" y="188.15" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.4" fill="#e3eefa">[20 Gbps, in a Google colo]</text><text x="799.0" y="219.65" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Dedicated Interconnect</text><text x="799.0" y="261.05" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">Your own 10 or 100 Gbps circuits.</text><text x="799.0" y="290.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">High, steady bandwidth.</text><rect x="1076" y="50" width="482" height="360" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1317.0" y="188.15" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.4" fill="#e3eefa">[5 Gbps, no colo nearby]</text><text x="1317.0" y="219.65" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Partner Interconnect</text><text x="1317.0" y="261.05" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">Through a provider, 50 Mbps to 50</text><text x="1317.0" y="290.45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23.4" fill="#ffffff" fill-opacity="0.93">Gbps per attachment.</text><rect x="40" y="450" width="1520" height="54.4" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="488.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">Interconnect is not encrypted by default: add MACsec on Dedicated, or HA VPN over Interconnect.</text></svg>