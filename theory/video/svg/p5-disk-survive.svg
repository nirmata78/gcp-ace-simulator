<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 520" width="1600" height="520"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="520" fill="#ffffff"/><rect x="40" y="50" width="353" height="340" rx="9" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.6"/><text x="216.5" y="179.445" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#ececec">[ephemeral]</text><text x="216.5" y="209.89499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Local SSD</text><text x="216.5" y="250.11499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Highest speed. Lost when</text><text x="216.5" y="278.53499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">the VM stops or is deleted</text><rect x="429" y="50" width="353" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="605.5" y="179.445" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[one zone]</text><text x="605.5" y="209.89499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Zonal PD / Hyperdisk</text><text x="605.5" y="250.11499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Attaches only to VMs in its</text><text x="605.5" y="278.53499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">zone</text><rect x="818" y="50" width="353" height="340" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="994.5" y="162.335" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#fde3de">[synchronous, two zones]</text><text x="994.5" y="192.78500000000003" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Regional PD /</text><text x="994.5" y="227.00500000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Balanced HA</text><text x="994.5" y="267.225" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Survives a zone failure,</text><text x="994.5" y="295.64500000000004" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">force-attach to a standby</text><rect x="1207" y="50" width="353" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1383.5" y="165.235" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[backup]</text><text x="1383.5" y="195.685" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Snapshot</text><text x="1383.5" y="235.905" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Point-in-time, restore</text><text x="1383.5" y="264.325" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">anywhere; recent writes can</text><text x="1383.5" y="292.745" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">be lost</text><rect x="40" y="430" width="1520" height="90.8" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="468.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">Regional disks are high availability. Snapshots are backup. Local SSD plus a durability requirement</text><text x="52" y="504.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">is always wrong.</text></svg>