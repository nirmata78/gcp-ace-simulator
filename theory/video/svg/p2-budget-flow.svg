<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 520" width="1600" height="520"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="520" fill="#ffffff"/><path d="M367.0,200.0 L437.0,200.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><path d="M764.0,200.0 L834.0,200.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><path d="M1161.0,200.0 L1231.0,200.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><rect x="40" y="50" width="327" height="300" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="203.5" y="159.445" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[threshold rules]</text><text x="203.5" y="189.89499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Budget</text><text x="203.5" y="230.11499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">50, 90, 100% of actual or</text><text x="203.5" y="258.53499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">forecast spend</text><rect x="437" y="50" width="327" height="300" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="600.5" y="159.445" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[programmatic route]</text><text x="600.5" y="189.89499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Pub/Sub topic</text><text x="600.5" y="230.11499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">The budget publishes a</text><text x="600.5" y="258.53499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">message</text><rect x="834" y="50" width="327" height="300" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="997.5" y="173.655" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[your code]</text><text x="997.5" y="204.10500000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Cloud Run function</text><text x="997.5" y="244.32500000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Subscribes, decides, acts</text><rect x="1231" y="50" width="327" height="300" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1394.5" y="159.445" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#fde3de">[with a cost]</text><text x="1394.5" y="189.89499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Action</text><text x="1394.5" y="230.11499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Scale down, notify, or</text><text x="1394.5" y="258.53499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">disable billing</text><rect x="40" y="390" width="1520" height="90.8" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="428.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">There is no built-in stop switch. And disabling billing shuts services down and can delete</text><text x="52" y="464.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">resources.</text></svg>