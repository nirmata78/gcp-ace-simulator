<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 520" width="1600" height="520"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="520" fill="#ffffff"/><rect x="40" y="50" width="353" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="216.5" y="165.235" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[Pods, horizontally]</text><text x="216.5" y="195.685" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">HPA</text><text x="216.5" y="235.905" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Replica count, on CPU,</text><text x="216.5" y="264.325" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">memory, custom or external</text><text x="216.5" y="292.745" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">metrics</text><rect x="429" y="50" width="353" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="605.5" y="165.235" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[Pods, vertically]</text><text x="605.5" y="195.685" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">VPA</text><text x="605.5" y="235.905" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Each Pod&#x27;s requests:</text><text x="605.5" y="264.325" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">recommend, or apply by</text><text x="605.5" y="292.745" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">recreating Pods</text><rect x="818" y="50" width="353" height="340" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="994.5" y="165.235" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[nodes, Standard]</text><text x="994.5" y="195.685" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Cluster autoscaler</text><text x="994.5" y="235.905" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Node count to fit pending</text><text x="994.5" y="264.325" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Pods; auto-provisioning</text><text x="994.5" y="292.745" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">creates pools</text><rect x="1207" y="50" width="353" height="340" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1383.5" y="193.655" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#fde3de">[nodes, automatic]</text><text x="1383.5" y="224.10500000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Autopilot</text><text x="1383.5" y="264.32500000000005" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Whatever the Pods request</text><rect x="40" y="430" width="1520" height="54.4" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="468.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">HPA and VPA must not both act on the same CPU or memory metric for one workload: they fight.</text></svg>