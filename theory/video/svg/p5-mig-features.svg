<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 510" width="1600" height="510"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="510" fill="#ffffff"/><rect x="40" y="50" width="353" height="300" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="216.5" y="159.445" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[application broken]</text><text x="216.5" y="189.89499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Autohealing</text><text x="216.5" y="230.11499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Health check on the MIG</text><text x="216.5" y="258.53499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">recreates the VM</text><rect x="429" y="50" width="353" height="300" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="605.5" y="173.655" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[wrong capacity]</text><text x="605.5" y="204.10500000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Autoscaling</text><text x="605.5" y="244.32500000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Changes the count of VMs</text><rect x="818" y="50" width="353" height="300" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="994.5" y="159.445" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#e3eefa">[new template]</text><text x="994.5" y="189.89499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Rolling updates</text><text x="994.5" y="230.11499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Rolls out with no outage;</text><text x="994.5" y="258.53499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">canary first</text><rect x="1207" y="50" width="353" height="300" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1383.5" y="173.655" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.7" fill="#fde3de">[zone failure]</text><text x="1383.5" y="204.10500000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Regional MIG</text><text x="1383.5" y="244.32500000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22.6" fill="#ffffff" fill-opacity="0.93">Spreads VMs across zones</text><rect x="40" y="390" width="1520" height="90.8" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="428.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">A load balancer&#x27;s health check only stops sending traffic. The MIG&#x27;s autohealing check recreates the</text><text x="52" y="464.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#3b2a07">VM. Set an initial delay.</text></svg>