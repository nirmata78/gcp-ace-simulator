<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 660" width="1600" height="660"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="660" fill="#ffffff"/><rect x="20" y="20" width="1560" height="540" rx="10" fill="#1168bd" fill-opacity="0.04" stroke="#1168bd" stroke-width="2" stroke-dasharray="9 6"/><text x="36" y="530" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1168bd">VPC vpc-prod: global, firewall rules and routes belong here</text><text x="36" y="550" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#1168bd">[one network, all regions]</text><rect x="60" y="60" width="680" height="380" rx="10" fill="#2d8a4e" fill-opacity="0.04" stroke="#2d8a4e" stroke-width="2" stroke-dasharray="9 6"/><text x="76" y="410" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2d8a4e">Region europe-central2</text><text x="76" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#2d8a4e">[subnet web-euc2 10.10.0.0/20]</text><rect x="860" y="60" width="680" height="380" rx="10" fill="#2d8a4e" fill-opacity="0.04" stroke="#2d8a4e" stroke-width="2" stroke-dasharray="9 6"/><text x="876" y="410" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2d8a4e">Region us-central1</text><text x="876" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#2d8a4e">[subnet web-usc1 10.20.0.0/20]</text><path d="M690.0,175.0 L1090.0,175.0" fill="none" stroke="#c8341f" stroke-width="1.9" marker-end="url(#c4a)"/><rect x="110" y="110" width="260" height="130" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="240.0" y="165.79" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">VM in zone a</text><text x="240.0" y="203.64999999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">10.10.0.5</text><rect x="430" y="110" width="260" height="130" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="560.0" y="165.79" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">VM in zone b</text><text x="560.0" y="203.64999999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">10.10.0.6</text><rect x="1090" y="110" width="260" height="130" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1220.0" y="165.79" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">VM in zone c</text><text x="1220.0" y="203.64999999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">10.20.0.7</text><text x="800" y="300" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#c8341f">internal IPs: no VPN, no peering</text><rect x="20" y="590" width="1560" height="88.2" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="32" y="627.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" fill="#3b2a07">Subnets are regional, spanning all zones of the region. VPCs are isolated from each other by default, even</text><text x="32" y="662.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" fill="#3b2a07">within one project.</text></svg>