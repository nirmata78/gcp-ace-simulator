# Machine-readable delivery plan. Execute tasks in dependency order, one pull request per task.
# Tracking issue: https://github.com/nirmata78/gcp-ace-simulator/issues/3
# Process rules: RELEASE.md. Mark progress by editing `status` on a task in the same PR that completes it.

schema_version: 1
id: docker-launch
title: One-command local launch with Docker, plus the tech debt that blocks it
issue: 3
target_release: 1.2.0 # was 1.1.0; 1.1.0 shipped first with compose, bin/ scripts and the study features
semver_rationale: >
  MINOR. Adds a new way to run the simulator and new configuration. The existing venv flow, the history file,
  the bank schema and the kb.py commands keep working.
status: in_progress # proposed | in_progress | done
created: 2026-11-04

goal: >
  A person with Docker and no Python can run one command, open http://localhost:8501, sit a full exam, download the
  PDF report, stop the container, start it again and still see their history.

target_experience:
  no_clone: docker run --rm -p 127.0.0.1:8501:8501 -v ace-state:/state ghcr.io/nirmata78/gcp-ace-simulator:1
  from_clone: docker compose up

success_criteria:
  - id: SC1
    statement: From a machine with Docker and no Python, a first exam can start with one command and no other setup.
    verify: Follow the README on a clean Linux amd64 VM and on macOS arm64; record both in the release PR.
  - id: SC2
    statement: History survives stopping, removing and re-creating the container.
    verify: Task T13's end-to-end test.
  - id: SC3
    statement: The published image contains no personal data and no excluded question text.
    verify: Task T13's image content check.
  - id: SC4
    statement: The container runs as non-root on a read-only root filesystem, and the published port binds to localhost only.
    verify: Task T13's security checks.
  - id: SC5
    statement: The simulator starts and completes an exam with no internet access.
    verify: Task T05's blocked-socket test.
  - id: SC6
    statement: The venv flow in the README still works unchanged.
    verify: CI keeps running the venv path on every supported Python.

baseline:
  measured: 2026-11-04
  commit: 85d8259
  tests: 89 passing, in one file (tests/test_simulator.py)
  ci: pytest and kb.py checks on Python 3.12 only. No lint, type check, coverage or dependency lock.
  coverage:
    method: pytest-cov with branch coverage; --cov=app --cov=src --cov=scripts; tests, theory and the private scripts/retro_content.py omitted
    total_percent: 32
    warning: >
      Running with --cov=. reports 65%, which is wrong. scripts/ is not a package, so unimported scripts are silently
      left out of the total. The source list must name app, src and scripts explicitly.
    per_file_percent:
      app.py: 0
      scripts/kb.py: 0
      scripts/retrospective.py: 0
      scripts/recap.py: 0
      scripts/recap_content.py: 0
      scripts/check_network.py: 52
      src/pdf_generator.py: 90
      src/models.py: 94
      src/exam_engine.py: 97
      src/blueprint.py: 99
  verified_facts:
    - app.py exits the whole server at startup when offline (os._exit(1)), though nothing in the app calls an LLM.
      ACE_SKIP_NETWORK_CHECK=1 is the only way past it.
    - The only LLM call is in scripts/kb.py, which imports anthropic lazily and has its own require_network() check.
    - HISTORY_PATH and REPORTS_DIR are fixed relative to the source tree. REPORTS_DIR is defined twice (src/exam_engine.py, src/pdf_generator.py).
    - History writes are atomic (temp file, then rename), so a killed container can't corrupt history.json.
    - The results page already has a PDF download button, so a host bind mount is not needed to get reports out.
    - pdf_generator handles webbrowser.open failing and shows a message instead. No custom font files are registered.
    - .streamlit/config.toml sets gatherUsageStats=false.
    - streamlit pulls in pandas, pyarrow and numpy, so the image will not be small.
    - requirements.txt mixes runtime, optional LLM and test dependencies, with lower bounds only.
  assumptions_to_verify:
    - id: A1
      statement: webbrowser.open returns False, rather than raising or hanging, in a container with no browser.
      verify_in: T11
    - id: A2
      statement: Streamlit runs on a read-only root filesystem with HOME and /tmp on tmpfs.
      verify_in: T11
    - id: A3
      statement: A named volume mounted at /state is writable by the image's non-root user on first run.
      verify_in: T11

